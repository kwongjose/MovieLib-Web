appId: com.movielib.web
productName: My Movie Library
directories:
  buildResources: build
  output: release

# For Windows 7 support we're pinned to Electron 22 (last version with
# Win7/8/8.1 support - Chromium dropped it in the version after) and
# better-sqlite3 8.x (pre-N-API; the newer N-API-based major targets a
# Node-API version newer than Electron 22's bundled Node 16 supports).
# better-sqlite3 8.x needs npmRebuild so electron-builder fetches its
# prebuilt binary matching Electron 22's ABI (110) - no local compiler
# needed, since WiseLibs publishes that exact prebuild.
npmRebuild: true

files:
  - out/**/*
  - package.json

# better-sqlite3's native .node binary and ffprobe-static's bundled ffprobe
# executable can't run from inside an asar archive - unpack them.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/ffprobe-static/**'

# Building both architectures since the Win7 target machine's bitness isn't
# known - an ia32 build also runs fine on 64-bit Windows.
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
