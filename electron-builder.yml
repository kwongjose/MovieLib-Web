appId: com.movielib.web
productName: My Movie Library
directories:
  buildResources: build
  output: release

# better-sqlite3 v13 ships prebuilt N-API binaries that already work across
# Electron versions without a rebuild (confirmed - see Phase 4 commit); the
# rebuild step needs Visual Studio Build Tools this machine doesn't have,
# and would be unnecessary work even where it is available.
npmRebuild: false

files:
  - out/**/*
  - package.json

# better-sqlite3's native .node binary and ffprobe-static's bundled ffprobe
# executable can't run from inside an asar archive - unpack them.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/ffprobe-static/**'

win:
  target: nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
